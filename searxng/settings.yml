# SearXNG Configuration
use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG (MagnaAssistance)"
  privacypolicy_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "magna_searxng_secret_key"
  base_url: http://localhost:8080/
  image_proxy: true
  public_instance: false

engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false
    weight: 1.5

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
    weight: 1.0

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
