name: PM Portal CI

on:
  push:
    branches: [develop, main, master]
    paths:
      - "src/modules/projects/**"
      - "scripts/pm-smoke.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/pm-ci.yml"
  pull_request:
    paths:
      - "src/modules/projects/**"
      - "scripts/pm-smoke.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/pm-ci.yml"

jobs:
  pm-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
