name: Deploy MagmaAssistance Backend

on:
  push:
    branches:
      - Development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -e

            cd /home/ubuntu/MagmaAssistance

            git fetch origin
            git checkout beta
            git pull origin beta

            source venv/bin/activate

            pip install -r requirements.txt

            sudo systemctl restart magmaassistance.service
            sudo systemctl restart magma-voice.service

            sudo systemctl status magmaassistance.service --no-pager
            sudo systemctl status magma-voice.service --no-pager

            echo "MagmaAssistance beta deployment completed successfully."
